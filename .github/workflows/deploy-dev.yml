name: Deploy to GitHub Pages (Dev)

on:
  push:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: pages-dev
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /agent_workflow/dev/

      - name: Deploy to GitHub Pages (dev subdirectory)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: dev
          # Deploys to the /dev subfolder of the gh-pages branch
          # Dev URL: https://<user>.github.io/agent_workflow/dev/
